server {
    listen 80;
    client_max_body_size 250m;

    # Resolve "api" at request time through Docker's DNS, so recreating the api
    # container (e.g. `docker compose up -d --build`) never leaves nginx on a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # API (uploads, range requests for audio seeking, synchronous extraction runs).
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
