[project]
name = "fnol-backend"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.*",
    "ignore:.*on_event is deprecated.*:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
